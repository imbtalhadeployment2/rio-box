<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIO BOX — Discover &amp; share photos and videos</title>
<meta name="description" content="RIO BOX is a community pinboard: create an account, upload photos and videos, and explore what everyone else is sharing.">
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E63946">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<header id="siteHeader">
  <a class="logo" href="#/" aria-label="RIO BOX home">
    <img class="logo-mark" src="/icon-192.png" alt="RIO BOX logo"><span class="logo-text">RIO&nbsp;BOX</span>
  </a>
  <form id="searchForm" class="search" role="search">
    <input id="searchInput" type="search" placeholder="Search photos, videos, tags…" autocomplete="off">
  </form>
  <nav id="mainNav" aria-label="Main"></nav>
</header>

<main id="app"></main>

<footer class="site-footer">
  <span><strong>RIO BOX</strong> — a community pinboard for photos &amp; videos.</span>
  <span class="footer-note">Upload what you love. Discover what others share.</span>
</footer>

<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
